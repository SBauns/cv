# Site settings
title: Simon Baunsgaard Ertner
email: simon@baunsgaard-ertner.dk
description: >-
  IT-sikkerhedsprofil med baggrund i softwareudvikling og erfaring med 
  governance, compliance og risikostyring.
baseurl: ""
url: "https://simonaertner.github.io"

# Build settings
theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Minima theme customizations
minima:
  skin: auto
  date_format: "%B %-d, %Y"
  social_links:
    - { platform: github, user_url: "https://github.com/Sbauns" }
    - { platform: gitlab, user_url: "https://gitlab.com/SimonBauns" }

# Navigation
nav:
  - name: Profil
    url: /
  - name: Kompetencer
    url: /competencies
  - name: Erfaring
    url: /experience
  - name: Uddannelse
    url: /education

# Google Analytics (optional - remove if not used)
google_analytics: ""

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - README.md
  - LICENSE